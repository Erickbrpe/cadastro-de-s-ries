<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Séries</title>
    <style>
        body {
        background-color: #f4f4f4;
        font-family: Arial, sans-serif;
        }
        h2 {
        text-align: left;
        color: rgb(101, 26, 213);
        }
        #area_formulario {
        background-color: white;
        padding: 20px;
        width: 600px;
        margin: 20px;
        }
        .botoes {
        color: black;
        padding: 5px 15px;
        margin-right: 5px;
        }
        
        .salvar {
        background-color: #a6ed18;
        }
        .limpar {
        background-color: #ff6666;
        }
        .editar {
        background-color: #66b3ff;
        }
        .consultar {
        background-color: #ffcc00;
        }
    </style>
</head>
<body>

    <div id="area_formulario">
        <h2>SISTEMA DE CADASTRO DE SÉRIES</h2>
        <hr>
        
        <form action="">
        <p>
            <label>1. Nome da série:</label><br>
            <input type="text" id="nome_serie" size="40">
        </p>
                
        <p>
            <label>2. Streaming onde a série é exibida:</label><br>
            <input type="text" id="streaming" size="40">
        </p>
                
        <p>
            <label>3. Autor ou criador da série:</label><br>
            <input type="text" id="autor" size="40">
        </p>
                
        <p>
            <label>4. Quantidade de temporadas:</label><br>
            <input type="text" id="temporadas" size="10">
        </p>
                
        <p>
            <label>5. Ano de criação:</label><br>
            <input type="text" id="ano" size="10">
        </p>
                
        <p>
            <label>6. Três principais personagens:</label><br>
            <input type="text" id="personagens" size="60">
        </p>
                
            <hr>
                
            <button type="submit" class="botoes salvar">Salvar</button>
            <button type="reset" class="botoes limpar">Limpar</button>
            <button type="button" class="botoes editar">Editar</button>
            <button type="button" class="botoes consultar">Consultar</button>
        </form>
    </div>

</body>
</html>
