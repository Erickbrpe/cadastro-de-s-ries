<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Séries</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Cadastro de Séries</h2>
    <form id="serieForm">
        <div class="form-group">
            <label for="nome">Nome da Série:</label>
            <input type="text" id="nome" value="Invencível" required>
        </div>
        <div class="form-group">
            <label for="streaming">Streaming onde é exibida:</label>
            <input type="text" id="streaming" value="Prime Video" required>
        </div>
        <div class="form-group">
            <label for="autor">Autor ou Criador:</label>
            <input type="text" id="autor" value="Robert Kirkman" required>
        </div>
        <div class="form-group">
            <label for="temporadas">Quantidade de Temporadas:</label>
            <input type="number" id="temporadas" value="4" required>
        </div>
        <div class="form-group">
            <label for="ano">Ano de Criação:</label>
            <input type="number" id="ano" value="2021" required>
        </div>
        <div class="form-group">
            <label for="personagens">Três Principais Personagens:</label>
            <input type="text" id="personagens" value="Mark Grayson, Omni-Man, Eve Atômica" required>
        </div>

        <div class="btn-container">
            <button type="button" class="btn-save" onclick="salvarSerie()">Salvar</button>
            <button type="button" class="btn-clear" onclick="limparCampos()">Limpar</button>
            <button type="button" class="btn-edit" onclick="editarSerie()">Editar</button>
            <button type="button" class="btn-query" onclick="consultarSerie()">Consultar</button>
        </div>
    </form>
</div>
